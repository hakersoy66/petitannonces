name: Recovery Probe

on:
  push:
    branches: [production-sync-20260923]
    paths: [".github/workflows/recovery-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe recovery endpoints
        run: |
          set +e
          for url in \
            http://213.246.39.6:9187/ \
            https://213.246.39.6:9187/ \
            https://petitannonces.fr:9187/; do
            echo "=== $url ==="
            curl -k -sS -m 8 -o /tmp/body -D /tmp/headers -w 'HTTP=%{http_code} CONNECT=%{time_connect} TOTAL=%{time_total}\n' "$url"
            sed -n '1,12p' /tmp/headers
            head -c 300 /tmp/body | tr '\n' ' '
            echo
          done
