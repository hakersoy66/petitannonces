name: iOS Native / TestFlight (No EAS)

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Build a signed IPA and upload it to TestFlight"
        required: true
        default: false
        type: boolean

concurrency:
  group: petitannonces-ios-native
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    environment: production
    timeout-minutes: 60
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_API_URL: https://petitannonces.fr/api
      IOS_BUNDLE_ID: fr.petitannonces.app
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_B64 }}
      IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
      IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      MOBILE_BUILD_HOST: mail.petitannonces.fr
      MOBILE_BUILD_USER: petitannonces

    steps:
      - name: Configure restricted source SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s ssh-ed25519 %s\n' \
            "$MOBILE_BUILD_HOST" \
            'AAAAC3NzaC1lZDI1NTE5AAAAICGApKU1t+cQj2iIJJmGn5jYpWTJ0zYBWgthc+rjEpqq' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Fetch private mobile source from build host
        run: |
          rm -rf apps/mobile
          mkdir -p apps/mobile
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            "$MOBILE_BUILD_USER@$MOBILE_BUILD_HOST" \
            > "$RUNNER_TEMP/petitannonces-mobile.tgz"
          tar -xzf "$RUNNER_TEMP/petitannonces-mobile.tgz" -C apps/mobile
          test -f apps/mobile/package.json
          test -f apps/mobile/fastlane/Fastfile
          test -f apps/mobile/scripts/ios-native-preflight.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install JavaScript dependencies
        working-directory: apps/mobile
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: pnpm typecheck

      - name: Verify production iOS identity
        working-directory: apps/mobile
        run: bash scripts/ios-native-preflight.sh

      - name: Generate native iOS project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      - name: Discover Xcode workspace and scheme
        working-directory: apps/mobile
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"
          SCHEME="$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d.get("workspace",{}).get("schemes",[]); print(s[0] if s else "")')"
          test -n "$SCHEME"
          echo "IOS_WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "IOS_SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "workspace=$WORKSPACE scheme=$SCHEME"

      - name: Unsigned native build smoke test
        if: ${{ inputs.upload_to_testflight == false }}
        working-directory: apps/mobile
        run: |
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Guard TestFlight publishing
        if: ${{ inputs.upload_to_testflight && vars.IOS_TESTFLIGHT_ENABLED != 'true' }}
        run: |
          echo "TestFlight publishing is locked. Set repository variable IOS_TESTFLIGHT_ENABLED=true after Apple Developer access is restored." >&2
          exit 1

      - name: Verify TestFlight signing prerequisites
        if: ${{ inputs.upload_to_testflight }}
        working-directory: apps/mobile
        run: bash scripts/ios-native-preflight.sh --signing

      - name: Install signing assets
        if: ${{ inputs.upload_to_testflight }}
        working-directory: apps/mobile
        run: bash scripts/install-ios-signing-assets.sh

      - uses: ruby/setup-ruby@v1
        if: ${{ inputs.upload_to_testflight }}
        with:
          ruby-version: '3.3'

      - name: Install Fastlane
        if: ${{ inputs.upload_to_testflight }}
        working-directory: apps/mobile
        run: bundle install --jobs 4 --retry 3

      - name: Build IPA and upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        working-directory: apps/mobile
        run: bundle exec fastlane ios testflight
