name: Import Production Source Delta

on:
  push:
    branches: [production-sync-20260923]
    paths: [".github/workflows/import-production-sync.yml"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: production-sync-20260923
          fetch-depth: 0

      - name: Download and verify source delta
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 30 -o /tmp/production-sync.tar.gz "https://media.petitannonces.fr/internal/source-sync/production-bed9d578-5bd7-4a63-86ee-338ee727b436.tar.gz"
          echo "246a9aea68b3249bcd26f6ed5af074c1f34f92768a03c2b7aff98cd7a0fac424  /tmp/production-sync.tar.gz" | sha256sum -c -

      - name: Safety scan
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar -xzf /tmp/production-sync.tar.gz -C "$work"
          forbidden="$(find "$work" -type f \(             -name '.env' -o -name '.env.*' -o             -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*.crt' -o             -name '*.log' -o -name '*.bak' -o -name '*.bak.*' -o -name '*.bak-*'           \) -print -quit)"
          test -z "$forbidden" || { echo "Forbidden file: $forbidden"; exit 1; }
          if grep -RIlE 'sk_live_[A-Za-z0-9]{16,}|rk_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' "$work" >/dev/null 2>&1; then
            echo "Potential secret pattern detected"
            exit 1
          fi
          echo "$work" > /tmp/pa_workdir

      - name: Apply production source delta
        run: |
          set -euo pipefail
          work="$(cat /tmp/pa_workdir)"
          deletions="$work/__pa_deletions.txt"
          rm -f "$work/__pa_deletions.txt"

          cp -a "$work"/. "$GITHUB_WORKSPACE"/

          if [ -f "$deletions" ]; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                apps/*|packages/*|scripts/*|infra/*|docs/*|.github/*) rm -f -- "$path" ;;
                *) echo "Unsafe deletion path: $path"; exit 1 ;;
              esac
            done < "$deletions"
          fi

          rm -f             .github/workflows/import-production-sync.yml             .github/workflows/media-public-probe.yml

          git config user.name "Petit Annonces Production Sync"
          git config user.email "hakersoy66@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "sync: import current production source delta"
          git push origin HEAD:production-sync-20260923
