name: SSH Port Diagnostic
on:
  push:
    branches: [production-sync-20260923]
    paths: [".github/workflows/ssh-port-diagnostic.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe common SSH ports
        run: |
          host=213.246.39.6
          for p in 22 2222 2200 2022 22222 443; do
            if timeout 4 bash -c "exec 3<>/dev/tcp/$host/$p" 2>/dev/null; then
              echo "PORT $p OPEN"
              timeout 2 bash -c "cat < /dev/tcp/$host/$p" 2>/dev/null | head -c 120 || true
              echo
            else
              echo "PORT $p CLOSED_OR_FILTERED"
            fi
          done
