name: Refresh Sync Lockfile

on:
  push:
    branches: [production-sync-20260923]
    paths: [".github/workflows/refresh-sync-lockfile.yml"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-sync-20260923
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh lockfile
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          rm -f .github/workflows/refresh-sync-lockfile.yml
          git config user.name "Petit Annonces Production Sync"
          git config user.email "hakersoy66@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/refresh-sync-lockfile.yml
          git diff --cached --quiet && exit 0
          git commit -m "sync: refresh lockfile"
          git push origin HEAD:production-sync-20260923
