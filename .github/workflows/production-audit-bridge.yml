name: Production Audit Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-audit-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          test -n "$PRODUCTION_HOST"
          test -n "$PRODUCTION_USER"
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s ssh-ed25519 %s\n' \
            "$PRODUCTION_HOST" \
            'AAAAC3NzaC1lZDI1NTE5AAAAIGb5fP7d4Vh1gELLdX9xwaHCkE5AFRp4TFS9Dn9tkr3Z' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify direct production access
        run: |
          timeout 30s ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            'set -e; ROOT=/var/www/petitannonces/repository; echo "WHOAMI=$(whoami)"; echo "HOST=$(hostname -f)"; test -d "$ROOT"; echo "HEAD=$(git -C "$ROOT" rev-parse HEAD 2>/dev/null || true)"'

      - name: Snapshot production source
        run: |
          timeout 120s ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            'set -e; ROOT=/var/www/petitannonces/repository; cd "$ROOT"; items=""; for p in apps packages scripts infra docs package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json tsconfig.json tsconfig.base.json; do [ -e "$p" ] && items="$items $p"; done; test -n "$items"; tar -czf - --exclude="node_modules" --exclude=".git" --exclude=".env" --exclude=".env.*" --exclude="*.pem" --exclude="*.key" --exclude="*.p12" --exclude="*.pfx" --exclude="*.crt" --exclude="*.log" --exclude=".next*" --exclude="dist" --exclude="coverage" $items' \
            > production-source.tar.gz
          test -s production-source.tar.gz
          ls -lh production-source.tar.gz

      - name: Upload production source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: production-source-snapshot
          path: production-source.tar.gz
          retention-days: 1
          if-no-files-found: error
