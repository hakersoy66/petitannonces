name: Media Public Probe

on:
  push:
    branches: [production-sync-20260923]
    paths: [".github/workflows/media-public-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe temporary object
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 -o /tmp/test.txt "https://media.petitannonces.fr/internal/source-sync/public-test-1790178560885.txt"
          test "$(cat /tmp/test.txt)" = "pa-sync-test"
          echo "MEDIA_PUBLIC_OK"
