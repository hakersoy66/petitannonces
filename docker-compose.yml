services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: petitannonces
      POSTGRES_PASSWORD: petitannonces
      POSTGRES_DB: petitannonces
    ports:
      - "5432:5432"
    volumes:
      - pa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petitannonces -d petitannonces"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pa_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pa_postgres:
  pa_redis:
