limit_req_zone $binary_remote_addr zone=pa_api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=pa_conn_per_ip:10m;

upstream pa_web { server 127.0.0.1:3000; keepalive 32; }
upstream pa_admin { server 127.0.0.1:3001; keepalive 16; }
upstream pa_api { server 127.0.0.1:4000; keepalive 32; }

server {
  listen 80;
  listen [::]:80;
  server_name petitannonces.fr www.petitannonces.fr admin.petitannonces.fr;
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name petitannonces.fr www.petitannonces.fr;

  ssl_certificate /etc/letsencrypt/live/petitannonces.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/petitannonces.fr/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:20m;
  ssl_session_timeout 1d;

  client_max_body_size 12m;
  limit_conn pa_conn_per_ip 30;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  location /api/ {
    limit_req zone=pa_api_per_ip burst=40 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_pass http://pa_api/;
  }

  location = /healthz {
    proxy_set_header Host $host;
    proxy_pass http://pa_api/health/ready;
    access_log off;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://pa_web;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin.petitannonces.fr;

  ssl_certificate /etc/letsencrypt/live/petitannonces.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/petitannonces.fr/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://pa_admin;
  }
}
